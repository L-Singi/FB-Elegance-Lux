  <script>
    (function () {
      var l = window.location;
      var path = l.pathname.replace(/^\/+|\/+$/g, '');
      if (path) {
        var query = l.search ? (l.search.charAt(0) === '?' ? l.search.slice(1) : l.search) : '';
        var params = [];
        params.push('rota=' + encodeURIComponent(path));
        if (query) params.push(query);
        var newUrl = l.protocol + '//' + l.host + '/?' + params.join('&') + l.hash;
        l.replace(newUrl);
      } else {
        l.replace(l.protocol + '//' + l.host + '/');
      }
    })();
  </script>
