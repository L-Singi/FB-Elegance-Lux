<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Elegance Lux</title>
  <script>
    (function () {
      var l = window.location;
      var path = l.pathname.replace(/^\/+|\/+$/g, '');
      if (path) {
        var query = l.search ? (l.search.charAt(0) === '?' ? l.search.slice(1) : l.search) : '';
        var params = [];
        params.push('rota=' + encodeURIComponent(path));
        if (query) params.push(query);
        var newUrl = l.protocol + '//' + l.host + '/?' + params.join('&') + l.hash;
        l.replace(newUrl);
      } else {
        l.replace(l.protocol + '//' + l.host + '/');
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A0B;
      color: #F2EFE9;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: #B8924F; }
  </style>
</head>
<body>
  <p>Carregando <a href="/">FB Elegance Lux</a>…</p>
</body>
</html>
